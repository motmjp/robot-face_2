<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cute Robot Face</title>
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-glow: rgba(0, 243, 255, 0.65);
      --neon-soft: rgba(0, 243, 255, 0.2);
      --eye-bg-deep: #031525;
      --eye-pupil: #25d4ff;
      --eye-dark: #004d73;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #02070d;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: none; /* Skjuler cursor helt for kiosk-skærm */
    }

    /* Digitale printbaner i siderne inspireret af billedet */
    .circuit-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: 
        radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(2, 7, 13, 0.95) 90%),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 80px 80px, 80px 80px;
    }

    .circuit-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.35;
      filter: drop-shadow(0 0 8px var(--neon-cyan));
    }

    /* Robotansigtets base med kontinuerlig organisk vejrtrækning */
    .robot-face {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: min(8vh, 60px);
      z-index: 10;
      animation: gentleBreathing 4.5s ease-in-out infinite alternate;
      transform-origin: center center;
    }

    @keyframes gentleBreathing {
      0% {
        transform: translateY(0px) scale(1);
      }
      100% {
        transform: translateY(-12px) scale(1.015);
      }
    }

    .eyes-container {
      display: flex;
      align-items: center;
      gap: min(12vw, 85px);
      position: relative;
    }

    .eye-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: min(3vh, 24px);
    }

    .eyebrow {
      width: min(28vw, 130px);
      height: min(2.5vh, 18px);
      background: #c3f9ff;
      border-radius: 20px;
      box-shadow: 
        0 0 15px var(--neon-cyan),
        0 0 35px var(--neon-glow);
      transform-origin: center center;
      transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .eye-socket {
      width: min(38vw, 180px);
      height: min(32vh, 250px);
      background: radial-gradient(circle at 50% 50%, var(--eye-bg-deep) 0%, #010a12 85%);
      border: 4px solid #57edff;
      border-radius: 95px;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 0 25px var(--neon-cyan),
        0 0 60px var(--neon-soft),
        inset 0 0 30px rgba(0, 243, 255, 0.4);
      transition: transform 0.12s ease, border-radius 0.3s ease;
    }

    /* Pupil container som følger blikket */
    .pupil-track {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .pupil {
      width: min(25vw, 120px);
      height: min(20vh, 160px);
      background: radial-gradient(circle at 45% 40%, #76f6ff 0%, var(--eye-pupil) 45%, var(--eye-dark) 85%);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
    }

    /* Stor primær lysrefleks */
    .pupil::before {
      content: "";
      position: absolute;
      top: 16%;
      left: 18%;
      width: 32%;
      height: 35%;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff;
    }

    /* Mindre sekundær lysrefleks for dybde */
    .pupil::after {
      content: "";
      position: absolute;
      bottom: 18%;
      right: 20%;
      width: 15%;
      height: 15%;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0.85;
      box-shadow: 0 0 6px #ffffff;
    }

    /* Blinke-effekt ved vertikal sammentrækning */
    .eye-socket.blinking {
      transform: scaleY(0.04) !important;
      border-radius: 20px;
    }

    /* Glad/tilfreds knibe-øjne mode (^ _ ^) */
    .robot-face.happy .eye-socket {
      height: min(15vh, 110px);
      border-radius: 100px 100px 10px 10px;
      transform: scaleY(0.5);
    }

    .cheeks-container {
      position: absolute;
      width: 120%;
      display: flex;
      justify-content: space-between;
      top: 65%;
      pointer-events: none;
    }

    .blush {
      width: min(12vw, 60px);
      height: min(3vh, 22px);
      background: radial-gradient(circle, rgba(255, 120, 200, 0.45) 0%, transparent 75%);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.8s ease;
      filter: blur(4px);
    }

    .robot-face.happy .blush {
      opacity: 1;
    }

    /* Den glødende mund */
    .mouth {
      width: min(20vw, 95px);
      height: min(4vh, 32px);
      border-bottom: 5px solid #82f5ff;
      border-radius: 0 0 60px 60px;
      box-shadow: 0 5px 20px var(--neon-cyan);
      transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Ekstra bredt smil */
    .robot-face.happy .mouth {
      width: min(26vw, 130px);
      height: min(6vh, 48px);
      border-bottom-width: 7px;
    }

    /* Taler-tilstand (Mund der animerer synkront med oplæsning) */
    .robot-face.speaking .mouth {
      animation: mouthTalking 0.25s ease-in-out infinite alternate;
      border-radius: 40px 40px 60px 60px;
      border: 4px solid #82f5ff;
      background: rgba(0, 243, 255, 0.25);
      box-shadow: 0 0 25px var(--neon-cyan);
    }

    @keyframes mouthTalking {
      0% {
        height: min(2vh, 16px);
        width: min(15vw, 75px);
        transform: scaleY(0.6);
      }
      100% {
        height: min(5.5vh, 46px);
        width: min(23vw, 110px);
        transform: scaleY(1.1);
      }
    }

    /* Holografisk tale-HUD display */
    .speech-hud {
      position: absolute;
      bottom: max(6vh, 45px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      width: min(88vw, 680px);
      background: rgba(3, 21, 37, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(0, 243, 255, 0.45);
      border-radius: 20px;
      padding: 20px 26px;
      box-shadow: 
        0 0 35px rgba(0, 243, 255, 0.25),
        inset 0 0 20px rgba(0, 243, 255, 0.12);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 30;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .speech-hud.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--neon-cyan);
      font-weight: 700;
    }

    .hud-badge-dot {
      width: 8px;
      height: 8px;
      background: #00f3ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00f3ff;
      animation: badgePulse 1.2s infinite;
    }

    @keyframes badgePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }

    .hud-headline {
      font-size: clamp(17px, 2.6vw, 24px);
      color: #ffffff;
      font-weight: 600;
      line-height: 1.45;
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
      word-break: break-word;
    }

    .hud-time {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 1px;
    }

    /* Diskret scanning-laser der lejlighedsvis fejer henover ansigtet */
    .scanner-beam {
      position: absolute;
      top: -20%;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent, #00f3ff, #ffffff, #00f3ff, transparent);
      box-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
    }

    .scanner-beam.active {
      animation: scanSweep 2.2s ease-in-out forwards;
    }

    @keyframes scanSweep {
      0% {
        top: -10%;
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.9;
      }
      100% {
        top: 110%;
        opacity: 0;
      }
    }

    /* Top Sci-Fi Status Bar */
    .top-status-bar {
      position: absolute;
      top: 24px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(11px, 1.4vw, 15px);
      letter-spacing: 2px;
      color: rgba(0, 243, 255, 0.7);
      font-family: 'Courier New', Courier, monospace;
      z-index: 40;
      pointer-events: none;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(0, 243, 255, 0.15);
      padding-bottom: 12px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .coffee-meter-bar {
      display: inline-block;
      width: 55px;
      height: 9px;
      background: rgba(0, 243, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
      vertical-align: middle;
      border: 1px solid rgba(0, 243, 255, 0.4);
    }

    .coffee-level {
      height: 100%;
      width: 22%;
      background: #ffb703;
      box-shadow: 0 0 8px #ffb703;
      transition: width 1s ease;
    }

    /* Disco / Party Mode */
    .robot-face.disco .eye-socket {
      animation: discoEyes 0.6s infinite alternate;
      border-color: #ff00ea !important;
      box-shadow: 0 0 35px #ff00ea, 0 0 70px rgba(255, 0, 234, 0.4) !important;
    }

    .robot-face.disco .mouth {
      border-color: #ffe600 !important;
      box-shadow: 0 5px 25px #ffe600 !important;
      animation: discoMouth 0.3s infinite alternate;
    }

    @keyframes discoEyes {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(180deg); transform: scale(1.08) rotate(3deg); }
    }

    @keyframes discoMouth {
      0% { transform: scaleX(0.9); }
      100% { transform: scaleX(1.2); }
    }

    /* Equalizer søjler under disco */
    .equalizer-bar-container {
      position: absolute;
      bottom: 25px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      height: 60px;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      z-index: 25;
    }

    .equalizer-bar-container.active {
      opacity: 0.9;
    }

    .eq-bar {
      width: 8px;
      background: #00f3ff;
      border-radius: 4px;
      box-shadow: 0 0 10px #00f3ff;
      animation: eqBounce 0.4s ease infinite alternate;
    }

    @keyframes eqBounce {
      0% { height: 10px; background: #00f3ff; }
      50% { background: #ff00ea; }
      100% { height: 55px; background: #ffe600; }
    }

    /* Biometrisk sigtekorn / Human Scanner */
    .target-reticle {
      position: absolute;
      width: min(70vw, 360px);
      height: min(70vw, 360px);
      border: 2px dashed rgba(0, 243, 255, 0.75);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 32;
      transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      animation: reticleSpin 12s linear infinite;
    }

    .target-reticle.active {
      opacity: 1;
    }

    @keyframes reticleSpin {
      100% { transform: rotate(360deg); }
    }

    .reticle-corner {
      position: absolute;
      width: 25px;
      height: 25px;
      border: 3px solid #00f3ff;
    }
    .reticle-corner.tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
    .reticle-corner.tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
    .reticle-corner.bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
    .reticle-corner.br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

    /* Nyset (Sneeze) Rystelse */
    .robot-face.sneeze-buildup {
      animation: sneezeShake 0.1s infinite;
    }

    @keyframes sneezeShake {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(Math.random() * 4px - 2px, -3px); }
    }

    .robot-face.sneeze-blast {
      animation: sneezeExplode 0.5s ease-out;
    }

    @keyframes sneezeExplode {
      0% { transform: scale(0.9) translateY(-25px); }
      30% { transform: scale(1.15) translateY(40px); }
      100% { transform: scale(1) translateY(0); }
    }

    /* Lysende data-pulser på printbanerne */
    .circuit-pulse {
      position: absolute;
      width: 6px;
      height: 28px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 12px #00f3ff, 0 0 24px #00f3ff;
      opacity: 0.8;
      pointer-events: none;
      animation: pulseDrop 4s linear infinite;
    }

    @keyframes pulseDrop {
      0% { top: -40px; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 105%; opacity: 0; }
    }

    /* Cyber-flue der flyver rundt på skærmen */
    .cyber-bug {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 14px #00f3ff, 0 0 28px #00f3ff;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .cyber-bug::after {
      content: '';
      position: absolute;
      inset: -4px;
      border: 1.5px dashed #00f3ff;
      border-radius: 50%;
      animation: spinBug 0.3s linear infinite;
    }

    @keyframes spinBug {
      100% { transform: rotate(360deg); }
    }

    /* Special-tilstande for øjnene */
    /* Hjerte-øjne */
    .eye-socket.hearts .pupil {
      background: radial-gradient(circle, #ff2a85 20%, #b5004e 90%) !important;
      clip-path: path('M 60 25 C 60 10, 45 0, 30 0 C 12 0, 0 16, 0 35 C 0 65, 45 95, 60 115 C 75 95, 120 65, 120 35 C 120 16, 108 0, 90 0 C 75 0, 60 10, 60 25 Z');
      transform: scale(1.1) !important;
      animation: heartbeat 0.7s infinite alternate ease-in-out;
      box-shadow: 0 0 30px #ff2a85 !important;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      100% { transform: scale(1.22); }
    }

    /* Træt / Gabende øjne */
    .robot-face.sleepy .eye-socket {
      height: min(10vh, 75px);
      border-radius: 30px;
      opacity: 0.85;
    }

    .robot-face.sleepy .mouth {
      width: min(15vw, 65px);
      height: min(6vh, 45px);
      border-radius: 50%;
      border: 4px solid #82f5ff;
      background: rgba(0, 243, 255, 0.15);
      animation: yawnExpand 2.8s ease-in-out infinite;
    }

    @keyframes yawnExpand {
      0%, 100% { transform: scale(0.85); }
      50% { transform: scale(1.25); }
    }

    /* Svævende Zzz */
    .zzz-particle {
      position: absolute;
      color: #00f3ff;
      font-weight: 900;
      font-size: clamp(20px, 3.5vw, 36px);
      text-shadow: 0 0 12px var(--neon-cyan);
      opacity: 0;
      pointer-events: none;
      animation: floatZ 3s ease-out forwards;
      z-index: 35;
    }

    @keyframes floatZ {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      30% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(50px, -110px) scale(1.5); }
    }

    /* Glitch / Matrix Tilstand */
    .robot-face.glitch {
      animation: glitchShake 0.15s infinite;
      filter: drop-shadow(-3px 0 red) drop-shadow(3px 0 cyan);
    }

    @keyframes glitchShake {
      0% { transform: translate(0); }
      25% { transform: translate(-5px, 3px); }
      50% { transform: translate(4px, -2px); }
      75% { transform: translate(-3px, -4px); }
      100% { transform: translate(0); }
    }

    .matrix-overlay {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,243,255,0.06) 0px, rgba(0,243,255,0.06) 2px, transparent 2px, transparent 6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 25;
    }

    .matrix-overlay.active {
      opacity: 1;
    }

    /* Pixel solbriller */
    .sunglasses {
      position: absolute;
      top: -120px;
      width: min(84vw, 420px);
      height: 70px;
      background: #060b13;
      border: 4px solid #00f3ff;
      box-shadow: 0 0 25px #00f3ff;
      border-radius: 6px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 45;
      transition: top 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
    }

    .sunglasses::before, .sunglasses::after {
      content: '';
      width: 42%;
      height: 78%;
      background: linear-gradient(135deg, rgba(0,243,255,0.7) 0%, transparent 60%);
      border: 2px solid rgba(255,255,255,0.5);
    }

    .sunglasses.drop {
      top: min(10vh, 80px);
    }

    /* Spontane robot-tankebobler */
    .thought-bubble {
      position: absolute;
      top: 14%;
      background: rgba(3, 21, 37, 0.9);
      border: 2px dashed var(--neon-cyan);
      border-radius: 25px;
      padding: 12px 24px;
      color: #bbf7ff;
      font-size: clamp(14px, 2vw, 19px);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
      opacity: 0;
      transform: scale(0.85) translateY(10px);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 35;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
      max-width: 80%;
      text-align: center;
    }

    .thought-bubble.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Circuit grid & sideprint -->
  <div class="circuit-overlay"></div>
  <div class="matrix-overlay" id="matrix-lines"></div>

  <!-- Top sci-fi statuslinje -->
  <div class="top-status-bar">
    <div class="status-item">
      <span>AI KERNEL:</span>
      <span id="sys-status" style="color: #6eff9f;">AKTIV</span>
    </div>
    <div class="status-item">
      <span>HUMØR:</span>
      <span id="mood-label" style="color: #00f3ff;">NYFIKEN</span>
    </div>
    <div class="status-item">
      <span>KAFFE:</span>
      <span class="coffee-meter-bar"><span class="coffee-level" id="coffee-bar"></span></span>
      <span id="coffee-pct">18%</span>
    </div>
    <div class="status-item">
      <span id="live-clock">--:--:--</span>
    </div>
  </div>

  <!-- Biometrisk sigtekorn -->
  <div class="target-reticle" id="reticle">
    <div class="reticle-corner tl"></div>
    <div class="reticle-corner tr"></div>
    <div class="reticle-corner bl"></div>
    <div class="reticle-corner br"></div>
  </div>

  <!-- Equalizer til Party Mode -->
  <div class="equalizer-bar-container" id="eq-container">
    <div class="eq-bar" style="animation-delay: 0.1s;"></div>
    <div class="eq-bar" style="animation-delay: 0.3s;"></div>
    <div class="eq-bar" style="animation-delay: 0.15s;"></div>
    <div class="eq-bar" style="animation-delay: 0.4s;"></div>
    <div class="eq-bar" style="animation-delay: 0.25s;"></div>
    <div class="eq-bar" style="animation-delay: 0.05s;"></div>
    <div class="eq-bar" style="animation-delay: 0.35s;"></div>
    <div class="eq-bar" style="animation-delay: 0.2s;"></div>
  </div>

  <!-- Lys-impulser der løber ned over printbanerne -->
  <div class="circuit-pulse" style="left: 80px; animation-duration: 3.6s;"></div>
  <div class="circuit-pulse" style="left: 185px; animation-duration: 5.2s; animation-delay: 1.8s;"></div>
  <div class="circuit-pulse" style="right: 85px; animation-duration: 4.1s; animation-delay: 0.7s;"></div>
  <div class="circuit-pulse" style="right: 175px; animation-duration: 4.8s; animation-delay: 2.3s;"></div>

  <!-- Cyber Flue -->
  <div class="cyber-bug" id="cyber-bug"></div>

  <!-- Tankeboble -->
  <div class="thought-bubble" id="thought-bubble">Beep boop...</div>

  <svg class="circuit-lines" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Venstre printbaner -->
    <path d="M 80 0 V 450 L 180 550 V 900 L 120 960 V 1400 L 190 1470 V 1920" stroke="#00f3ff" stroke-width="2.5" stroke-dasharray="12 6" />
    <circle cx="180" cy="550" r="5" fill="#00f3ff" />
    <circle cx="120" cy="960" r="5" fill="#00f3ff" />
    <circle cx="190" cy="1470" r="5" fill="#00f3ff" />

    <!-- Højre printbaner -->
    <path d="M 1000 0 V 380 L 910 470 V 850 L 970 910 V 1350 L 890 1430 V 1920" stroke="#00f3ff" stroke-width="2.5" stroke-dasharray="12 6" />
    <circle cx="910" cy="470" r="5" fill="#00f3ff" />

  <div class="scanner-beam" id="scanner"></div>

  <main class="robot-face" id="face">
    <!-- Pixel solbriller til 'Deal with it' mode -->
    <div class="sunglasses" id="sunglasses"></div>

    <!-- Øjenpar -->
    <div class="eyes-container">
      <div class="cheeks-container">
        <div class="blush"></div>
        <div class="blush"></div>
      </div>

      <!-- Venstre øje -->
      <div class="eye-column">
        <div class="eyebrow" id="brow-l"></div>
        <div class="eye-socket" id="eye-socket-l">
          <div class="pupil-track" id="pupil-l">
            <div class="pupil"></div>
          </div>
        </div>
      </div>

      <!-- Højre øje -->
      <div class="eye-column">
        <div class="eyebrow" id="brow-r"></div>
        <div class="eye-socket" id="eye-socket-r">

            <div class="pupil"></div>

    <!-- Mund -->

  <!-- Holografisk tale-HUD -->
  <div class="speech-hud" id="speech-hud">
    <div class="hud-badge">
      <span class="hud-badge-dot"></span>
      <span id="hud-status">SENESTE OPDATERING</span>
    </div>
    <div class="hud-headline" id="hud-text">Indlæser overskrift...</div>
    <div class="hud-time" id="hud-timestamp">Synkroniserer...</div>
  </div>

  <script>
    /* DOM Elementer */
    const pupilLeft = document.getElementById('pupil-l');
    const pupilRight = document.getElementById('pupil-r');
    const browLeft = document.getElementById('brow-l');
    const browRight = document.getElementById('brow-r');
    const socketLeft = document.getElementById('eye-socket-l');
    const socketRight = document.getElementById('eye-socket-r');
    const face = document.getElementById('face');
    const scanner = document.getElementById('scanner');
    const cyberBug = document.getElementById('cyber-bug');
    const sunglasses = document.getElementById('sunglasses');
    const thoughtBubble = document.getElementById('thought-bubble');
    const matrixLines = document.getElementById('matrix-lines');
    const sysStatus = document.getElementById('sys-status');
    const liveClock = document.getElementById('live-clock');
    const coffeeBar = document.getElementById('coffee-bar');
    const coffeePct = document.getElementById('coffee-pct');
    const moodLabel = document.getElementById('mood-label');
    const reticle = document.getElementById('reticle');
    const eqContainer = document.getElementById('eq-container');
    const speechHud = document.getElementById('speech-hud');
    const hudText = document.getElementById('hud-text');
    const hudTimestamp = document.getElementById('hud-timestamp');
    const hudStatus = document.getElementById('hud-status');

    /* Global tilstand & konfiguration */
    let isBusyWithEvent = false;
    const FETCH_INTERVAL_MS = 180000; // 3 minutter
    const FEED_URL = 'https://cdn.zeitcloud.io/prod/i1gt/uja9/wtnw/kzl5/main.html';

    const robotThoughts = [
      "Scanner lokalet for kaffe og kage... ☕",
      "Er det mon snart fyraften? 🤔",
      "Beep boop! Verdens sødeste skærm er online. ✨",
      "Husk at drikke vand (og smøre lejerne)! 💧",
      "Analyserer data... Resultat: I er fantastiske! 😄",
      "Glæder mig allerede til fredag! 🕺",
      "Opdaterer interne kognitive sub-rutiner...",
      "Søger efter forbigående smil... Fundet! 😊"
    ];

    // Indbygget Web Audio Synthesizer (Ingen eksterne filer behøves)
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Spil en robot-lyd (frekvens, type, varighed)
    function playBeep(freq = 440, type = 'sine', duration = 0.12, volume = 0.08) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    // Søde R2-D2 / Wall-E pip
    function playChirp() {
      const notes = [523, 659, 784, 1046];
      notes.forEach((freq, idx) => {
        setTimeout(() => playBeep(freq + Math.random() * 80, 'triangle', 0.08, 0.06), idx * 75);
      });
    }

    // Honk lyd til "næsedut"
    function playHonk() {
      playBeep(260, 'sawtooth', 0.22, 0.1);
      setTimeout(() => playBeep(330, 'triangle', 0.15, 0.08), 80);
    }

    // Vis tankeboble med automatisk skjul
    function showThought(text, duration = 3500) {
      if (!thoughtBubble) return;
      thoughtBubble.textContent = text;
      thoughtBubble.classList.add('show');
      setTimeout(() => {
        thoughtBubble.classList.remove('show');
      }, duration);
    }

    // Opdatering af levende ur fastlåst til dansk tidszone (Europe/Copenhagen)
    function updateClock() {
      const now = new Date();
      liveClock.textContent = now.toLocaleTimeString('da-DK', {
        timeZone: 'Europe/Copenhagen',
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });

      // Tjek klokkeslæt for tidsstyret humør
      const hours = parseInt(now.toLocaleTimeString('da-DK', { timeZone: 'Europe/Copenhagen', hour: '2-digit', hour12: false }), 10);
      const day = now.getDay(); // 5 = Fredag

      if (day === 5 && hours >= 14 && !isBusyWithEvent) {
        moodLabel.textContent = 'WEEKEND! 🎉';
        moodLabel.style.color = '#ffe600';
      } else if (hours >= 7 && hours <= 9) {
        moodLabel.textContent = 'TRÆT / MORGEN';
        moodLabel.style.color = '#ffaa44';
      } else if (hours >= 11 && hours <= 13) {
        moodLabel.textContent = 'FROKOSTSULTEN 🥪';
        moodLabel.style.color = '#57edff';
      } else if (hours >= 14 && hours <= 16) {
        moodLabel.textContent = 'KAGEJAGT 🍰';
        moodLabel.style.color = '#ff6eb4';
      } else {
        moodLabel.textContent = 'OPTIMAL ⚡';
        moodLabel.style.color = '#6eff9f';
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Autonomt blik (Kigger rundt med naturlige pauser)
    const gazePositions = [
      { x: 0,   y: 0,   bL: 0,   bR: 0   }, // Ligeud
      { x: -28, y: 0,   bL: -4,  bR: -4  }, // Venstre
      { x: 28,  y: 0,   bL: 4,   bR: 4   }, // Højre
      { x: 0,   y: -22, bL: 8,   bR: -8  }, // Op (tænksom)
      { x: 0,   y: 18,  bL: -2,  bR: 2   }, // Ned
      { x: -22, y: -16, bL: 4,   bR: -7  }, // Skråt venstre-op
      { x: 22,  y: -16, bL: -7,  bR: 4   }, // Skråt højre-op
      { x: 0,   y: 0,   bL: 0,   bR: 0   }  // Retur til midten
    ];

    function performGaze() {
      if (!isBusyWithEvent) {
        const gaze = gazePositions[Math.floor(Math.random() * gazePositions.length)];
        pupilLeft.style.transform = `translate(${gaze.x}%, ${gaze.y}%)`;
        pupilRight.style.transform = `translate(${gaze.x}%, ${gaze.y}%)`;
        browLeft.style.transform = `rotate(${gaze.bL}deg) translateY(${gaze.y * 0.25}px)`;
        browRight.style.transform = `rotate(${gaze.bR}deg) translateY(${gaze.y * 0.25}px)`;
      }
      const nextDelay = 1800 + Math.random() * 2600;
      setTimeout(performGaze, nextDelay);
    }

    // Autonomt blink (både enkelt- og hurtige dobbeltblink)
    function performBlink() {
      if (!isBusyWithEvent) {
        socketLeft.classList.add('blinking');
        socketRight.classList.add('blinking');

        setTimeout(() => {
          socketLeft.classList.remove('blinking');
          socketRight.classList.remove('blinking');

          // 25% chance for et hurtigt ekstra dobbeltblink
          if (Math.random() < 0.25) {
            setTimeout(() => {
              socketLeft.classList.add('blinking');
              socketRight.classList.add('blinking');
              setTimeout(() => {
                socketLeft.classList.remove('blinking');
                socketRight.classList.remove('blinking');
              }, 120);
            }, 140);
          }
        }, 130);
      }
      const nextBlinkDelay = 2500 + Math.random() * 3800;
      setTimeout(performBlink, nextBlinkDelay);
    }

    // SKETCH 1: Cyber-flue jagt (øjnene følger fluen i realtid)
    function triggerFlyEvent() {
      isBusyWithEvent = true;
      cyberBug.style.opacity = '1';
      playChirp();

      const waypoints = [
        { x: window.innerWidth * 0.2, y: window.innerHeight * 0.25 },
        { x: window.innerWidth * 0.8, y: window.innerHeight * 0.3 },
        { x: window.innerWidth * 0.5, y: window.innerHeight * 0.48 } // Lander på næsen
      ];

      cyberBug.style.transform = `translate(${waypoints[0].x}px, ${waypoints[0].y}px)`;
      pupilLeft.style.transform = 'translate(-35%, -25%)';
      pupilRight.style.transform = 'translate(-35%, -25%)';

      setTimeout(() => {
        cyberBug.style.transform = `translate(${waypoints[1].x}px, ${waypoints[1].y}px)`;
        pupilLeft.style.transform = 'translate(35%, -20%)';
        pupilRight.style.transform = 'translate(35%, -20%)';
      }, 1000);

      setTimeout(() => {
        cyberBug.style.transform = `translate(${waypoints[2].x}px, ${waypoints[2].y}px)`;
        // Skeler mod næsen
        pupilLeft.style.transform = 'translate(45%, 15%)';
        pupilRight.style.transform = 'translate(-45%, 15%)';
        showThought('Hov! En cyber-flue på min næse?! 🪰', 2000);
      }, 2000);

      setTimeout(() => {
        // Fluen flyver væk, robotten ryster det af sig
        cyberBug.style.opacity = '0';
        playHonk();
        pupilLeft.style.transform = 'none';
        pupilRight.style.transform = 'none';
        isBusyWithEvent = false;
      }, 3300);
    }

    // SKETCH 2: Døsig & gabende med Zzz-bobler
    function triggerDrowsyEvent() {
      isBusyWithEvent = true;
      face.classList.add('sleepy');
      showThought('*Gaaaab*... CPU trænger til hviletilstand... 💤', 3500);

      // Skab et par svævende Zzz partikler
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          const zzz = document.createElement('div');
          zzz.className = 'zzz-particle';
          zzz.textContent = 'Z';
          zzz.style.left = `${window.innerWidth * 0.5 + 30 + i * 20}px`;
          zzz.style.top = `${window.innerHeight * 0.45 - i * 15}px`;
          document.body.appendChild(zzz);
          setTimeout(() => zzz.remove(), 3000);
        }, i * 600);
      }

      setTimeout(() => {
        // Vågner med et spjæt!
        face.classList.remove('sleepy');
        playChirp();
        showThought('Jeg er vågen! Klar igen! ⚡', 2500);
        isBusyWithEvent = false;
      }, 4200);
    }

    // SKETCH 3: Hjerte-øjne
    function triggerHeartEyes() {
      isBusyWithEvent = true;
      face.classList.add('happy');
      socketLeft.classList.add('hearts');
      socketRight.classList.add('hearts');
      showThought('I ser bare super godt ud i dag! ❤️✨', 3500);
      playChirp();

      setTimeout(() => {
        socketLeft.classList.remove('hearts');
        socketRight.classList.remove('hearts');
        face.classList.remove('happy');
        isBusyWithEvent = false;
      }, 4000);
    }

    // SKETCH 4: Pixel solbriller ("Deal with it")
    function triggerSunglassesEvent() {
      isBusyWithEvent = true;
      sunglasses.classList.add('drop');
      showThought('100% Cool Robot Mode aktiveret. 😎', 3800);
      playBeep(220, 'sawtooth', 0.35, 0.08);

      setTimeout(() => {
        sunglasses.classList.remove('drop');
        isBusyWithEvent = false;
      }, 4200);
    }

    // SKETCH 5: Glitch & Matrix genstart
    function triggerGlitchEvent() {
      isBusyWithEvent = true;
      face.classList.add('glitch');
      matrixLines.classList.add('active');
      sysStatus.textContent = 'REBOOT...';
      sysStatus.style.color = '#ff3366';
      showThought('FEJL 404: Kaffe-mangel! Genstarter AI... ⚠️', 2800);
      playBeep(180, 'square', 0.25, 0.09);

      setTimeout(() => {
        face.classList.remove('glitch');
        matrixLines.classList.remove('active');
        sysStatus.textContent = 'AKTIV';
        sysStatus.style.color = '#6eff9f';
        playChirp();
        isBusyWithEvent = false;
      }, 3000);
    }

    // SKETCH 6: Nyset (Aaaaa-tju!)
    function triggerSneezeEvent() {
      isBusyWithEvent = true;
      showThought('Haaa... haaa...', 2000);
      playChirp();

      // Rysten bygger op
      face.classList.add('sneeze-buildup');
      pupilLeft.style.transform = 'scale(1.4)';
      pupilRight.style.transform = 'scale(1.4)';
      browLeft.style.transform = 'rotate(20deg) translateY(-14px)';
      browRight.style.transform = 'rotate(-20deg) translateY(-14px)';

      setTimeout(() => {
        // SELVE NYSET!
        face.classList.remove('sneeze-buildup');
        face.classList.add('sneeze-blast');
        playHonk();
        showThought('ATTSJUUU!! 💥💨', 2400);

        socketLeft.classList.add('blinking');
        socketRight.classList.add('blinking');

        setTimeout(() => {
          socketLeft.classList.remove('blinking');
          socketRight.classList.remove('blinking');
          pupilLeft.style.transform = 'translate(0, 12%) scale(0.9)';
          pupilRight.style.transform = 'translate(0, 12%) scale(0.9)';
          showThought('Pyha... det lettede!', 2600);

          setTimeout(() => {
            face.classList.remove('sneeze-blast');
            pupilLeft.style.transform = 'none';
            pupilRight.style.transform = 'none';
            browLeft.style.transform = 'none';
            browRight.style.transform = 'none';
            isBusyWithEvent = false;
          }, 2400);
        }, 500);
      }, 2200);
    }

    // SKETCH 7: Biometrisk Menneske-Scanner
    function triggerHumanScanEvent() {
      isBusyWithEvent = true;
      reticle.classList.add('active');
      playBeep(880, 'square', 0.1, 0.05);

      const targetPositions = [
        { x: window.innerWidth * 0.5 - 180, y: window.innerHeight * 0.35 },
        { x: window.innerWidth * 0.4 - 180, y: window.innerHeight * 0.5 }
      ];

      reticle.style.left = `${targetPositions[0].x}px`;
      reticle.style.top = `${targetPositions[0].y}px`;

      const scanFindings = [
        "MENNESKE DETEKTERET... HUMØR: 98% FREMDRIFT!",
        "SCANNING AF FORBIPASSERENDE: KAFFENIVEAU BEKYMRENDE LAVT.",
        "MÅL IDENTIFICERET: SMUKKERE END GENNEMSNITTET! 😉",
        "BIOMETRISK ANALYSE: 100% KLAR TIL FYRAFTEN."
      ];

      const chosenFinding = scanFindings[Math.floor(Math.random() * scanFindings.length)];
      showThought(chosenFinding, 4500);

      setTimeout(() => {
        reticle.style.left = `${targetPositions[1].x}px`;
        reticle.style.top = `${targetPositions[1].y}px`;
        playChirp();
      }, 1800);

      setTimeout(() => {
        reticle.classList.remove('active');
        isBusyWithEvent = false;
      }, 4800);
    }

    // SKETCH 8: Disco / Rave Fredagsparti
    function triggerDiscoParty() {
      isBusyWithEvent = true;
      face.classList.add('disco');
      eqContainer.classList.add('active');
      sunglasses.classList.add('drop');
      showThought('DISCO TIME!! Føl rytmen! 🕺🪩', 4500);

      // Lille synthesizer-rytme
      let beat = 0;
      const partyInterval = setInterval(() => {
        playBeep(beat % 2 === 0 ? 150 : 350, 'sawtooth', 0.09, 0.07);
        beat++;
        if (beat > 10) clearInterval(partyInterval);
      }, 350);

      setTimeout(() => {
        face.classList.remove('disco');
        eqContainer.classList.remove('active');
        sunglasses.classList.remove('drop');
        isBusyWithEvent = false;
      }, 4800);
    }

    // Henter nyhedssiden, parser overskrift og læser op
    async function checkFeedAndSpeak() {
      if (isBusyWithEvent) return;

      try {
        let htmlText = '';
        // Forsøg direkte fetch med cache-busting
        try {
          const res = await fetch(`${FEED_URL}?_t=${Date.now()}`);
          if (res.ok) htmlText = await res.text();
        } catch (e) {
          // Fallback via CORS proxy hvis kiosk blokerer
          const proxyRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(FEED_URL)}`);
          if (proxyRes.ok) htmlText = await proxyRes.text();
        }

        let headline = '';
        if (htmlText) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');
          const el = doc.querySelector('h1, h2, h3, .headline, .title, strong, p') || doc.querySelector('title');
          if (el) headline = el.textContent.trim().replace(/\s+/g, ' ');
        }

        if (!headline) {
          headline = "Alt kører som smurt i dag. God arbejdslyst til alle!";
        }

        // Vis på det holografiske tale-HUD
        isBusyWithEvent = true;
        hudText.textContent = headline;
        hudTimestamp.textContent = 'Sidst hentet: ' + new Date().toLocaleTimeString('da-DK', { timeZone: 'Europe/Copenhagen' });
        speechHud.classList.add('visible');
        face.classList.add('speaking');
        playChirp();

        // Oplæsning via Web Speech API (dansk stemme hvis tilgængelig)
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(headline);
          utter.lang = 'da-DK';
          utter.rate = 1.0;
          utter.pitch = 1.25;

          utter.onend = () => {
            face.classList.remove('speaking');
            setTimeout(() => speechHud.classList.remove('visible'), 5000);
            isBusyWithEvent = false;
          };
          utter.onerror = () => {
            face.classList.remove('speaking');
            setTimeout(() => speechHud.classList.remove('visible'), 5000);
            isBusyWithEvent = false;
          };
          window.speechSynthesis.speak(utter);
        } else {
          // Hvis ingen TTS, hold munden animerende i 4 sekunder
          setTimeout(() => {
            face.classList.remove('speaking');
            setTimeout(() => speechHud.classList.remove('visible'), 4000);
            isBusyWithEvent = false;
          }, 4000);
        }
      } catch (err) {
        console.warn('Kunne ikke hente feed:', err);
      }
    }

    // Reager hvis nogen rører skærmen (Kæl eller Dut på næsen)
    window.addEventListener('pointerdown', (e) => {
      getAudioContext(); // Lås lyd op ved bruger-interaktion

      const isCenter = Math.abs(e.clientX - window.innerWidth / 2) < 120 &&
                       Math.abs(e.clientY - window.innerHeight / 2) < 160;

      if (isCenter) {
        // Dut på næsen!
        playHonk();
        isBusyWithEvent = true;
        face.classList.add('happy');
        browLeft.style.transform = 'rotate(-18deg) translateY(-14px)';
        browRight.style.transform = 'rotate(18deg) translateY(-14px)';
        pupilLeft.style.transform = 'scale(0.85)';
        pupilRight.style.transform = 'scale(0.85)';
        showThought('*BEEP* Hej med dig! Hvem dutter mig på næsen? 😄', 3200);

        setTimeout(() => {
          face.classList.remove('happy');
          browLeft.style.transform = 'none';
          browRight.style.transform = 'none';
          pupilLeft.style.transform = 'none';
          pupilRight.style.transform = 'none';
          isBusyWithEvent = false;
        }, 3000);
      } else {
        // Pupillerne kigger mod berøringen
        const xOffset = ((e.clientX / window.innerWidth) - 0.5) * 60;
        const yOffset = ((e.clientY / window.innerHeight) - 0.5) * 50;
        pupilLeft.style.transform = `translate(${xOffset}%, ${yOffset}%)`;
        pupilRight.style.transform = `translate(${xOffset}%, ${yOffset}%)`;
        playChirp();
      }
    });

    // Autonome mikro-begivenheder: Udvidet med nys, scanning, disco, fluer osv.
    function triggerRandomMicroEvent() {
      if (isBusyWithEvent) return;

      const events = [
        'flyChase',
        'drowsy',
        'heartEyes',
        'sunglasses',
        'glitchReboot',
        'happyGlance',
        'scannerSweep',
        'curiousTilt',
        'randomThought',
        'sneeze',
        'humanScan',
        'discoParty'
      ];
      const chosenEvent = events[Math.floor(Math.random() * events.length)];

      if (chosenEvent === 'flyChase') {
        triggerFlyEvent();
      } else if (chosenEvent === 'drowsy') {
        triggerDrowsyEvent();
      } else if (chosenEvent === 'heartEyes') {
        triggerHeartEyes();
      } else if (chosenEvent === 'sunglasses') {
        triggerSunglassesEvent();
      } else if (chosenEvent === 'glitchReboot') {
        triggerGlitchEvent();
      } else if (chosenEvent === 'sneeze') {
        triggerSneezeEvent();
      } else if (chosenEvent === 'humanScan') {
        triggerHumanScanEvent();
      } else if (chosenEvent === 'discoParty') {
        triggerDiscoParty();
      } else if (chosenEvent === 'randomThought') {
        const t = robotThoughts[Math.floor(Math.random() * robotThoughts.length)];
        showThought(t, 3800);
        playChirp();
      } else if (chosenEvent === 'happyGlance') {
        // Robotten lukker øjnene i et tilfreds smil og rødmer svagt
        isBusyWithEvent = true;
        face.classList.add('happy');
        browLeft.style.transform = 'rotate(-12deg) translateY(-8px)';
        browRight.style.transform = 'rotate(12deg) translateY(-8px)';

        setTimeout(() => {
          face.classList.remove('happy');
          isBusyWithEvent = false;
        }, 3200);

      } else if (chosenEvent === 'scannerSweep') {
        // En laser-linje scanner roligt over skærmen
        scanner.classList.add('active');
        pupilLeft.style.transform = 'translate(0%, -20%)';
        pupilRight.style.transform = 'translate(0%, -20%)';

        setTimeout(() => {
          pupilLeft.style.transform = 'translate(0%, 25%)';
          pupilRight.style.transform = 'translate(0%, 25%)';
        }, 1100);

        setTimeout(() => {
          scanner.classList.remove('active');
        }, 2300);

      } else if (chosenEvent === 'curiousTilt') {
        // Robotten lægger hovedet lidt på skrå med asymmetriske bryn
        browLeft.style.transform = 'rotate(-16deg) translateY(-12px)';
        browRight.style.transform = 'rotate(8deg) translateY(4px)';
        pupilLeft.style.transform = 'translate(10%, -15%)';
        pupilRight.style.transform = 'translate(10%, -15%)';

        setTimeout(() => {
          browLeft.style.transform = 'none';
          browRight.style.transform = 'none';
        }, 2600);
      }

      // Let dynamisk justering af kaffe-niveauet
      const rndCoffee = Math.floor(10 + Math.random() * 40);
      coffeeBar.style.width = `${rndCoffee}%`;
      coffeePct.textContent = `${rndCoffee}%`;

      // Kør et nyt event hvert 10. til 20. sekund for masser af liv
      const nextEventDelay = 10000 + Math.random() * 10000;
      setTimeout(triggerRandomMicroEvent, nextEventDelay);
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Start blikcyklus
      setTimeout(performGaze, 1000);
      // Start blinkecyklus
      setTimeout(performBlink, 2200);
      // Start mikro-events
      setTimeout(triggerRandomMicroEvent, 5000);

      // Hent og læs første overskrift 3 sekunder efter opstart
      setTimeout(checkFeedAndSpeak, 3000);

      // Gentag hver 3. minut
      setInterval(checkFeedAndSpeak, FETCH_INTERVAL_MS);
    });
  </script>
</body>
</html>
